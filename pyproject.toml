[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
sqlalchemy_events = ["py.typed"]

[project]
name = "sqlalchemy-events-lib"
version = "0.5.0"
description = "Event-driven extension for SQLAlchemy that enables listening to database CUD events. This library allows you to react to database changes in real time using a clean, declarative API."
requires-python = ">=3.12"
authors = [
    {name = "Alexey Kostarev", email = "normjkeeewm@gmail.com"}
]
dependencies = [
    "sqlalchemy[asyncio]>=2.0.49,<3",
]
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
keywords = ["sqlalchemy", "postgresql", "events", "listen", "notify"]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29,<1"]
alembic = ["alembic>=1.13,<2"]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=5,<8",
    "asyncpg>=0.29,<1",
    "python-dotenv",
    "alembic>=1.13,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=5,<8",
    "asyncpg>=0.29,<1",
    "python-dotenv",
    "alembic>=1.13,<2",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
sa-events = "sqlalchemy_events.cli:main"

[project.urls]
Homepage = "https://github.com/NormanwOw/SQLAlchemy-Events"
Repository = "https://github.com/NormanwOw/SQLAlchemy-Events"
Issues = "https://github.com/NormanwOw/SQLAlchemy-Events/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["sqlalchemy_events"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src/sqlalchemy_events"]
